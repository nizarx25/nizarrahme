<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061312"/>
      <stop offset="100%" stop-color="#0B211E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0%" stop-color="#00E5B0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00E5B0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Grid pattern -->
  <g stroke="#173A35" stroke-width="1" opacity="0.5">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Brand mark -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
    <text x="80" y="200" font-size="28" font-weight="600" letter-spacing="0.3em" fill="#00E5B0">PREMIUM DOMAIN MARKETPLACE</text>
    <text x="80" y="340" font-size="84" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">NIZAR RAHME</text>
    <text x="80" y="420" font-size="42" font-weight="500" fill="#B8C8C4">Brandable domains for AI, SaaS</text>
    <text x="80" y="470" font-size="42" font-weight="500" fill="#B8C8C4">and technology businesses</text>

    <!-- Accent bar -->
    <rect x="80" y="500" width="120" height="6" fill="#FF4D2E"/>

    <!-- Footer info -->
    <text x="80" y="570" font-size="20" font-weight="500" fill="#718581" font-family="ui-monospace, monospace">nizarrahme.com</text>
    <text x="1120" y="570" font-size="20" font-weight="500" fill="#718581" text-anchor="end" font-family="ui-monospace, monospace">SINCE 2023</text>
  </g>
</svg>