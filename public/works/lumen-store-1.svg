      <stop offset="0%" stop-color="#0B211E"/>
      <stop offset="100%" stop-color="#102A26"/>
    </linearGradient>
    <radialGradient id="coralGlow" cx="0.3" cy="0.6" r="0.5">
      <stop offset="0%" stop-color="#FF4D2E" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF4D2E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg3)"/>
  <rect width="1200" height="800" fill="url(#coralGlow)"/>
  <rect x="120" y="160" width="480" height="540" rx="24" fill="#061312" stroke="#173A35"/>
  <rect x="160" y="200" width="400" height="320" rx="12" fill="#102A26"/>
  <circle cx="360" cy="360" r="80" fill="#173A35"/>
